<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Household Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');
  :root {
    --ink:#152922; --ink2:#1F3B31; --paper:#F4EEDD; --paper2:#EAE2C8;
    --brass:#C08A2E; --forest:#3E6B52; --brick:#A85138; --slate:#4B5A63;
    --olive:#7A7440; --teal:#2F6B6B; --inktext:#241F16; --muted:#6B6152;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--paper2); color:var(--inktext); }
  .display { font-family:'Spectral',Georgia,serif; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  header.cover { background:linear-gradient(160deg,var(--ink),var(--ink2)); padding:28px 18px 20px; }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .brand .box { width:26px; height:26px; border-radius:3px; background:var(--brass); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .brand span { color:var(--brass); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
  header.cover h1 { color:var(--paper); font-size:24px; margin:0; }
  .subrow { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color:var(--paper); }
  .subrow select { background:transparent; border:none; color:var(--brass); font-size:12px; }
  .members { opacity:.7; }
  nav.tabs { display:flex; padding:0 10px; margin-top:-10px; gap:4px; }
  nav.tabs button { flex:1; background:transparent; border:none; padding:10px 4px; font-size:11px; font-weight:500; color:var(--muted); border-radius:6px 6px 0 0; cursor:pointer; }
  nav.tabs button.active { background:var(--paper2); color:var(--ink); }
  main { max-width:600px; margin:0 auto; padding:16px 14px 60px; }
  .card { background:rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.08); border-radius:10px; padding:16px; margin-bottom:14px; }
  .stamp { display:flex; flex-direction:column; gap:4px; padding:12px 14px; border:1px solid rgba(0,0,0,.1); border-radius:6px; background:rgba(255,255,255,.4); }
  .stamp .label { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .stamp .val { font-size:20px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pill { font-size:11px; padding:2px 9px; border-radius:999px; font-weight:500; display:inline-block; }
  .strip { background:var(--paper); border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.15); margin-bottom:10px; }
  .strip .edge { height:9px; background-image:radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 5.5px); background-size:12px 9px; background-repeat:repeat-x; }
  .strip .edge.bottom { transform:rotate(180deg); }
  .strip .body { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .strip .merchant { font-family:'Spectral',serif; font-size:15px; }
  .strip .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .strip .amt { font-family:'IBM Plex Mono',monospace; font-size:16px; }
  .strip button { background:none; border:none; cursor:pointer; padding:4px; color:var(--muted); }
  .strip button.del { color:var(--brick); }
  label { font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; display:block; margin-bottom:4px; }
  input, select { width:100%; padding:8px 10px; border-radius:6px; border:1px solid rgba(0,0,0,.15); background:#fff; font-size:14px; font-family:inherit; }
  .field { margin-bottom:10px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { padding:10px 16px; border-radius:6px; border:none; font-weight:500; font-size:14px; cursor:pointer; }
  .btn-primary { background:var(--ink); color:var(--paper); flex:1; }
  .btn-primary:disabled { opacity:.4; }
  .btn-ghost { background:transparent; border:1px solid rgba(0,0,0,.15); color:var(--muted); }
  .btn-choice { display:flex; align-items:center; gap:12px; padding:16px; border-radius:10px; border:2px dashed rgba(192,138,46,.5); background:rgba(255,255,255,.35); width:100%; text-align:left; cursor:pointer; margin-bottom:10px; }
  .btn-choice.manual { border:1px solid rgba(0,0,0,.1); border-style:solid; }
  .btn-choice .ic { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .btn-choice .title { font-size:14px; font-weight:500; }
  .btn-choice .desc { font-size:12px; color:var(--muted); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { padding:6px 12px; border-radius:999px; font-size:12px; font-weight:500; background:rgba(255,255,255,.4); cursor:pointer; }
  .chip.active { background:var(--ink); color:var(--paper); }
  .hidden { display:none !important; }
  .center { text-align:center; }
  .muted { color:var(--muted); font-size:13px; }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters select { font-size:12px; padding:6px 8px; }
  .totalcard { background:var(--ink); border-radius:10px; padding:16px; color:var(--paper); margin-bottom:14px; }
  .totalcard .amt { font-family:'IBM Plex Mono',monospace; font-size:26px; }
  .legend-row { display:flex; align-items:center; justify-content:space-between; font-size:12px; margin-bottom:6px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13px; display:none; z-index:50; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="loadscreen" class="center" style="padding:80px 20px; color:var(--paper); background:var(--ink); min-height:100vh;">Loading…</div>
<div id="app" class="hidden">
  <header class="cover">
    <div class="brand"><div class="box">💰</div><span>Household Ledger</span></div>
    <h1 class="display">This month's account</h1>
    <div class="subrow">
      <span class="members" id="membersLine">—</span>
      <span style="margin-left:auto;">
        <select id="currencySelect"><option>MMK</option><option>USD</option><option>SGD</option><option>THB</option></select>
      </span>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="add">Add Entry</button>
    <button data-tab="ledger">All Entries</button>
    <button data-tab="reports">Reports</button>
  </nav>
  <main>
    <section id="tab-dashboard"></section>
    <section id="tab-add" class="hidden"></section>
    <section id="tab-ledger" class="hidden"></section>
    <section id="tab-reports" class="hidden"></section>
  </main>
</div>
<div id="toast"></div>

<script>
const API_TOKEN = "81abd462bffc0747bec02c8ed0d530ff45b35585";
const CATEGORIES = ["Food & Groceries","Dining Out","Transport","Utilities","Household","Health","Education","Shopping","Entertainment","Travel","Other"];
const CAT_COLORS = ["#A85138","#7A7440","#2F6B6B","#4B5A63","#3E6B52","#C08A2E","#8A5A44","#5C6E8C","#946B3E","#4E7A6A","#6B6152"];
const catColor = c => CAT_COLORS[CATEGORIES.indexOf(c) === -1 ? 10 : CATEGORIES.indexOf(c)];
const symbolFor = c => c==="MMK"?"Ks":c==="USD"?"$":c==="SGD"?"S$":c==="THB"?"฿":c;
const fmt = (n,c) => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:c==="MMK"?0:2,maximumFractionDigits:c==="MMK"?0:2});
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);

let expenses = [], settings = { currency:"MMK", members:[] };
let editingId = null, scanBase64 = null, scanMediaType = null, tab = "dashboard";

// ---------- Plain-canvas charts (no external library) ----------
function drawDoughnut(canvasId, values, colors) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth || 120;
  canvas.width = size * dpr; canvas.height = size * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2, outerR = size / 2 - 2, innerR = outerR * 0.6;
  const total = values.reduce((a, v) => a + v, 0) || 1;
  let start = -Math.PI / 2;
  values.forEach((v, i) => {
    const angle = (v / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, start, start + angle);
    ctx.arc(cx, cy, innerR, start + angle, start, true);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    start += angle;
  });
}
function drawBarChart(canvasId, labels, values, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 130;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const max = Math.max(...values, 1);
  const labelH = 16, chartH = h - labelH;
  const n = values.length;
  const gap = 10;
  const barW = (w - gap * (n + 1)) / n;
  ctx.font = "11px Inter, sans-serif";
  ctx.fillStyle = "#6B6152";
  ctx.textAlign = "center";
  values.forEach((v, i) => {
    const barH = max > 0 ? (v / max) * (chartH - 6) : 0;
    const x = gap + i * (barW + gap);
    const y = chartH - barH;
    ctx.beginPath();
    const r = Math.min(4, barW / 2);
    ctx.moveTo(x, chartH);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + barW - r, y);
    ctx.arcTo(x + barW, y, x + barW, y + r, r);
    ctx.lineTo(x + barW, chartH);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = "#6B6152";
    ctx.fillText(labels[i], x + barW / 2, h - 2);
  });
}

async function apiGet(path){ const r = await fetch(path,{headers:{"x-api-token":API_TOKEN}}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function apiSend(path, method, body){
  const r = await fetch(path,{method, headers:{"Content-Type":"application/json","x-api-token":API_TOKEN}, body: body!==undefined?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error(r.status);
  return r.status===204 ? null : r.json();
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2500); }

function fromRow(row){
  return { id:row.id, date:(row.date||"").slice(0,10), amount:Number(row.amount), currency:row.currency,
    category:row.category, merchant:row.merchant||"", note:row.note||"", enteredBy:row.entered_by||"",
    source:row.source, createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now() };
}
function toBody(f){ return { date:f.date, amount:Number(f.amount), currency:f.currency, category:f.category, merchant:f.merchant, note:f.note, enteredBy:f.enteredBy }; }

async function boot(){
  try {
    const [s, ex] = await Promise.all([apiGet("/settings"), apiGet("/expenses")]);
    settings = { currency: s.currency||"MMK", members: s.members||[] };
    expenses = ex.map(fromRow);
    document.getElementById("loadscreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("currencySelect").value = settings.currency;
    render();
  } catch(e){
    document.getElementById("loadscreen").innerHTML = "Couldn't load the ledger. Refresh to try again.";
  }
}

document.getElementById("currencySelect").addEventListener("change", async (e)=>{
  settings.currency = e.target.value;
  try { await apiSend("/settings","PUT",{currency:settings.currency}); } catch(_){}
  render();
});

document.querySelectorAll("nav.tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    tab = btn.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", b===btn));
    document.querySelectorAll("main > section").forEach(s=>s.classList.add("hidden"));
    document.getElementById("tab-"+tab).classList.remove("hidden");
    if (tab==="add") resetAdd();
    render();
  });
});

function render(){
  renderDashboard(); renderLedger(); renderReports();
}

function monthBounds(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),1); }
function sum(arr){ return arr.filter(e=>e.currency===settings.currency).reduce((a,e)=>a+Number(e.amount||0),0); }

function renderDashboard(){
  const el = document.getElementById("tab-dashboard");
  const now = new Date();
  const mStart = monthBounds();
  const thisMonth = expenses.filter(e=>new Date(e.date)>=mStart);
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
  const thisWeek = expenses.filter(e=>new Date(e.date)>=weekAgo);
  const catMap = {};
  thisMonth.forEach(e=>{ if(e.currency!==settings.currency) return; catMap[e.category]=(catMap[e.category]||0)+Number(e.amount||0); });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const topCat = cats[0]?.[0] || "—";

  el.innerHTML = `
    <div class="grid2" style="margin-bottom:14px;">
      <div class="stamp"><span class="label">This month</span><span class="val mono">${symbolFor(settings.currency)} ${fmt(sum(thisMonth),settings.currency)}</span></div>
      <div class="stamp"><span class="label">This week</span><span class="val mono">${symbolFor(settings.currency)} ${fmt(sum(thisWeek),settings.currency)}</span></div>
      <div class="stamp"><span class="label">Entries logged</span><span class="val mono">${thisMonth.length}</span></div>
      <div class="stamp"><span class="label">Top category</span>${topCat!=="—" ? `<span class="pill" style="background:${catColor(topCat)}22;color:${catColor(topCat)};border:1px solid ${catColor(topCat)}55;width:fit-content;">${topCat}</span>` : '<span class="muted">—</span>'}</div>
    </div>
    <div class="card"><h3 class="display" style="font-size:15px;margin:0 0 10px;">Where it went — this month</h3>
      ${cats.length===0 ? '<p class="muted">Nothing logged yet this month.</p>' : `
      <div style="display:flex;gap:16px;align-items:center;">
        <div style="width:120px;height:120px;"><canvas id="catChart"></canvas></div>
        <div style="flex:1;">${cats.slice(0,6).map(([name,val])=>`<div class="legend-row"><span><span class="dot" style="background:${catColor(name)}"></span>${name}</span><span class="mono">${fmt(val,settings.currency)}</span></div>`).join("")}</div>
      </div>`}
    </div>
    <div class="card"><h3 class="display" style="font-size:15px;margin:0 0 10px;">Last 6 months</h3>
      <div style="height:130px;"><canvas id="trendChart"></canvas></div>
    </div>
    <h3 class="display" style="font-size:15px;margin:14px 0 8px;">Recent entries</h3>
    <div id="recentList"></div>
    <div id="usageCard"></div>
  `;
  document.getElementById("recentList").innerHTML = expenses.slice(0,4).map(stripHtml).join("") || '<p class="muted">No entries yet — add your first one.</p>';
  renderUsageCard();
  wireStripButtons(el);

  if (cats.length) {
    drawDoughnut("catChart", cats.map(c => c[1]), cats.map(c => catColor(c[0])));
  }
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:d.getFullYear()+"-"+d.getMonth(), label:d.toLocaleString("en",{month:"short"}), total:0}); }
  expenses.forEach(e=>{ if(e.currency!==settings.currency) return; const d=new Date(e.date); const k=d.getFullYear()+"-"+d.getMonth(); const m=months.find(mo=>mo.key===k); if(m) m.total+=Number(e.amount||0); });
  drawBarChart("trendChart", months.map(m => m.label), months.map(m => m.total), "#3E6B52");
}

let usageCache = null;
async function renderUsageCard() {
  const el = document.getElementById("usageCard");
  if (!el) return;
  if (!usageCache) {
    try { usageCache = await apiGet("/usage/summary"); } catch (e) { el.innerHTML = ""; return; }
  }
  const u = usageCache;
  const fmtUsd = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: n < 1 ? 4 : 2, maximumFractionDigits: n < 1 ? 4 : 2 });
  const fmtTok = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
  el.innerHTML = `
    <h3 class="display" style="font-size:15px;margin:18px 0 8px;">Claude API usage</h3>
    <div class="card">
      <div class="grid2" style="margin-bottom:10px;">
        <div class="stamp"><span class="label">This month (est.)</span><span class="val mono">${fmtUsd(u.thisMonth.estimatedCost)}</span></div>
        <div class="stamp"><span class="label">All time (est.)</span><span class="val mono">${fmtUsd(u.allTime.estimatedCost)}</span></div>
      </div>
      <div class="legend-row"><span>Calls this month</span><span class="mono">${u.thisMonth.calls}</span></div>
      <div class="legend-row"><span>Tokens in / out (month)</span><span class="mono">${fmtTok(u.thisMonth.inputTokens)} / ${fmtTok(u.thisMonth.outputTokens)}</span></div>
      <p class="muted" style="margin-top:8px;margin-bottom:0;font-size:11px;">Estimated from actual token counts at $${u.pricePerMInput}/$${u.pricePerMOutput} per million tokens (in/out). Not Anthropic's official invoice — check console.anthropic.com for that.</p>
    </div>
  `;
}

function stripHtml(e){
  return `<div class="strip"><div class="edge"></div><div class="body">
    <div style="min-width:0;">
      <div><span class="merchant">${e.merchant||"Unlabeled entry"}</span> <span class="pill" style="background:${catColor(e.category)}22;color:${catColor(e.category)};border:1px solid ${catColor(e.category)}55;">${e.category}</span></div>
      <div class="meta">${e.date}${e.enteredBy? " · "+e.enteredBy:""}${e.note? " · "+e.note:""}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <span class="amt">${symbolFor(e.currency)} ${fmt(e.amount,e.currency)}</span>
      <button class="edit" data-id="${e.id}">✎</button>
      <button class="del" data-id="${e.id}">🗑</button>
    </div>
  </div><div class="edge bottom"></div></div>`;
}
function wireStripButtons(container){
  container.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>startEdit(b.dataset.id)));
  container.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>deleteEntry(b.dataset.id)));
}

function emptyForm(){ return { date:todayStr(), amount:"", currency:settings.currency, category:CATEGORIES[0], merchant:"", note:"", enteredBy:"" }; }
let form = emptyForm();

function resetAdd(){
  editingId = null; scanBase64 = null; scanMediaType = null; form = emptyForm();
  renderAddChoose();
}
function renderAddChoose(){
  document.getElementById("tab-add").innerHTML = `
    <button class="btn-choice" id="scanBtn"><div class="ic" style="background:#C08A2E22;">📷</div><div><div class="title">Scan a receipt</div><div class="desc">Take a photo or upload — details get filled in for you</div></div></button>
    <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" />
    <button class="btn-choice manual" id="manualBtn"><div class="ic" style="background:#3E6B5222;">✎</div><div><div class="title">Enter by hand</div><div class="desc">For cash, transfers, or anything without a receipt</div></div></button>
  `;
  document.getElementById("scanBtn").addEventListener("click",()=>document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", e=>handleFile(e.target.files[0]));
  document.getElementById("manualBtn").addEventListener("click", ()=>{ form=emptyForm(); editingId=null; renderForm("Add to ledger"); });
}

function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=()=>rej(); r.readAsDataURL(file); }); }

async function handleFile(file){
  if(!file) return;
  document.getElementById("tab-add").innerHTML = '<div class="center" style="padding:40px 0;"><div class="muted">Reading the receipt…</div></div>';
  try {
    const base64 = await fileToBase64(file);
    scanBase64 = base64; scanMediaType = file.type || "image/jpeg";
    const extracted = await apiSend("/expenses/scan","POST",{ base64, mediaType: scanMediaType });
    form = {
      date: extracted.date || todayStr(),
      amount: extracted.amount!=null ? String(extracted.amount) : "",
      currency: extracted.currency || settings.currency,
      category: CATEGORIES.includes(extracted.category) ? extracted.category : "Other",
      merchant: extracted.merchant || "", note: extracted.note || "", enteredBy: "",
    };
    renderForm("Add to ledger", true);
  } catch(e){
    document.getElementById("tab-add").innerHTML = `<div class="center" style="padding:30px 0;">
      <p class="muted">Couldn't read that receipt clearly.</p>
      <button class="btn btn-primary" id="handEntryBtn" style="margin-top:10px;">Enter details by hand</button>
    </div>`;
    document.getElementById("handEntryBtn").addEventListener("click",()=>{ form=emptyForm(); renderForm("Add to ledger"); });
  }
}

function renderForm(submitLabel, showPreview){
  const el = document.getElementById("tab-add");
  el.innerHTML = `
    ${showPreview ? '<p class="muted" style="margin-bottom:10px;">Check the details below before adding to the ledger.</p>' : ""}
    <div class="row2">
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${form.date}"></div>
      <div class="field"><label>Amount</label><div style="display:flex;gap:4px;">
        <select id="f_currency" style="width:80px;"><option ${form.currency==="MMK"?"selected":""}>MMK</option><option ${form.currency==="USD"?"selected":""}>USD</option><option ${form.currency==="SGD"?"selected":""}>SGD</option><option ${form.currency==="THB"?"selected":""}>THB</option></select>
        <input type="number" id="f_amount" value="${form.amount}" placeholder="0">
      </div></div>
    </div>
    <div class="field"><label>Merchant / label</label><input type="text" id="f_merchant" value="${form.merchant}" placeholder="e.g. City Mart, Grab"></div>
    <div class="row2">
      <div class="field"><label>Category</label><select id="f_category">${CATEGORIES.map(c=>`<option ${form.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Entered by</label><input list="membersList" id="f_enteredBy" value="${form.enteredBy}" placeholder="Name">
        <datalist id="membersList">${settings.members.map(m=>`<option value="${m}">`).join("")}</datalist>
      </div>
    </div>
    <div class="field"><label>Note (optional)</label><input type="text" id="f_note" value="${form.note}"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" id="submitBtn" ${!form.amount?"disabled":""}>${submitLabel}</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
    </div>
    <p class="muted" id="saveErr" style="color:var(--brick);display:none;"></p>
  `;
  ["f_date","f_amount","f_currency","f_merchant","f_category","f_enteredBy","f_note"].forEach(id=>{
    document.getElementById(id).addEventListener("input", ()=>{
      form.date=document.getElementById("f_date").value;
      form.amount=document.getElementById("f_amount").value;
      form.currency=document.getElementById("f_currency").value;
      form.merchant=document.getElementById("f_merchant").value;
      form.category=document.getElementById("f_category").value;
      form.enteredBy=document.getElementById("f_enteredBy").value;
      form.note=document.getElementById("f_note").value;
      document.getElementById("submitBtn").disabled = !form.amount;
    });
  });
  document.getElementById("cancelBtn").addEventListener("click", ()=>{ tab="dashboard"; document.querySelector('[data-tab="dashboard"]').click(); });
  document.getElementById("submitBtn").addEventListener("click", submitForm);
}

async function submitForm(){
  if(!form.amount) return;
  try {
    if (editingId){
      const row = await apiSend("/expenses/"+editingId,"PUT",toBody(form));
      const updated = fromRow(row);
      expenses = expenses.map(x=>x.id===editingId?updated:x);
    } else {
      const row = await apiSend("/expenses","POST",toBody(form));
      expenses = [fromRow(row), ...expenses];
    }
    if (form.enteredBy && !settings.members.includes(form.enteredBy)) settings.members.push(form.enteredBy);
    toast("Saved to ledger");
    document.querySelector('[data-tab="ledger"]').click();
  } catch(e){
    const err = document.getElementById("saveErr");
    if (err){ err.style.display="block"; err.textContent="Couldn't save that entry — check your connection and try again."; }
  }
}

function startEdit(id){
  const e = expenses.find(x=>x.id===id); if(!e) return;
  form = { date:e.date, amount:String(e.amount), currency:e.currency, category:e.category, merchant:e.merchant, note:e.note, enteredBy:e.enteredBy };
  editingId = id;
  tab = "add";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab==="add"));
  document.querySelectorAll("main > section").forEach(s=>s.classList.add("hidden"));
  document.getElementById("tab-add").classList.remove("hidden");
  renderForm("Save changes");
}

async function deleteEntry(id){
  const prev = expenses;
  expenses = expenses.filter(x=>x.id!==id);
  render();
  try { await apiSend("/expenses/"+id,"DELETE"); } catch(e){ expenses = prev; render(); }
}

let ledgerFilter = { category:"All", person:"All" };
function renderLedger(){
  const el = document.getElementById("tab-ledger");
  const filtered = expenses.filter(e=>{
    if (ledgerFilter.category!=="All" && e.category!==ledgerFilter.category) return false;
    if (ledgerFilter.person!=="All" && e.enteredBy!==ledgerFilter.person) return false;
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date) || b.createdAt-a.createdAt);
  el.innerHTML = `
    <div class="filters">
      <select id="filtCat"><option value="All">All categories</option>${CATEGORIES.map(c=>`<option ${ledgerFilter.category===c?"selected":""}>${c}</option>`).join("")}</select>
      <select id="filtPerson"><option value="All">Everyone</option>${settings.members.map(m=>`<option ${ledgerFilter.person===m?"selected":""}>${m}</option>`).join("")}</select>
    </div>
    <div id="ledgerList">${filtered.map(stripHtml).join("") || '<p class="muted center">No entries match this filter.</p>'}</div>
  `;
  document.getElementById("filtCat").addEventListener("change", e=>{ ledgerFilter.category=e.target.value; renderLedger(); });
  document.getElementById("filtPerson").addEventListener("change", e=>{ ledgerFilter.person=e.target.value; renderLedger(); });
  wireStripButtons(el);
}

let reportRange = "thisMonth", customFrom = todayStr(), customTo = todayStr();
function reportBounds(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if (reportRange==="thisMonth") return [new Date(y,m,1), new Date(y,m+1,0)];
  if (reportRange==="lastMonth") return [new Date(y,m-1,1), new Date(y,m,0)];
  if (reportRange==="thisYear") return [new Date(y,0,1), new Date(y,11,31)];
  return [new Date(customFrom), new Date(customTo)];
}
function renderReports(){
  const el = document.getElementById("tab-reports");
  const [from,to] = reportBounds(); to.setHours(23,59,59,999);
  const entries = expenses.filter(e=>{ const d=new Date(e.date); return d>=from && d<=to; }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const total = sum(entries);
  const byCat = {}; entries.forEach(e=>{ if(e.currency!==settings.currency) return; byCat[e.category]=(byCat[e.category]||0)+Number(e.amount||0); });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  el.innerHTML = `
    <div class="chips">
      ${[["thisMonth","This month"],["lastMonth","Last month"],["thisYear","This year"],["custom","Custom"]].map(([k,l])=>`<button class="chip ${reportRange===k?"active":""}" data-range="${k}">${l}</button>`).join("")}
    </div>
    ${reportRange==="custom" ? `<div class="row2" style="margin-bottom:12px;"><input type="date" id="custFrom" value="${customFrom}"><input type="date" id="custTo" value="${customTo}"></div>` : ""}
    <div class="totalcard"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brass);">Statement total</span>
      <div class="amt">${symbolFor(settings.currency)} ${fmt(total,settings.currency)}</div>
      <div class="muted" style="color:var(--paper);opacity:.6;">${entries.length} entries</div>
    </div>
    <div class="card"><h3 class="display" style="font-size:15px;margin:0 0 10px;">By category</h3>
      ${catRows.map(([c,v])=>`<div class="legend-row"><span class="pill" style="background:${catColor(c)}22;color:${catColor(c)};border:1px solid ${catColor(c)}55;">${c}</span><span class="mono">${fmt(v,settings.currency)}</span></div>`).join("") || '<p class="muted">Nothing in this range.</p>'}
    </div>
    <button class="btn btn-primary" id="exportBtn" style="width:100%;background:var(--forest);margin-bottom:14px;" ${entries.length===0?"disabled":""}>⬇ Export statement as CSV</button>
    <div>${entries.map(stripHtml).join("")}</div>
  `;
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ reportRange=c.dataset.range; renderReports(); }));
  const cf = document.getElementById("custFrom"), ct = document.getElementById("custTo");
  if (cf) cf.addEventListener("change", e=>{ customFrom=e.target.value; renderReports(); });
  if (ct) ct.addEventListener("change", e=>{ customTo=e.target.value; renderReports(); });
  const exp = document.getElementById("exportBtn");
  if (exp) exp.addEventListener("click", ()=>{
    const rows = [["Date","Merchant","Category","Amount","Currency","Entered by","Note"]];
    entries.forEach(e=>rows.push([e.date,e.merchant,e.category,e.amount,e.currency,e.enteredBy,e.note]));
    const csv = rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const blob = new Blob([csv],{type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="statement-"+reportRange+".csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  });
  wireStripButtons(el);
}

resetAdd();
boot();
</script>
</body>
</html>
